name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release after publishing
      id-token: write   # for npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm
      # npm 11.5.1+ is required for trusted publishing. Node 20 ships with
      # npm 10.x, so upgrade before publishing. Provenance is automatic
      # under trusted publishing — no flag needed.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
      # Create a GitHub Release with auto-generated notes (commits + PRs
      # since the previous tag) only after the npm publish succeeded.
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
