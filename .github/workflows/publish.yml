name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release after publishing
      id-token: write   # for npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm
      # Fail fast on a mistyped tag or a forgotten `npm version`, before
      # anything is published.
      - name: Check tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      # A pre-release version (x.y.z-rc.1) goes to the `next` dist-tag so
      # it never becomes what `npm install` picks by default.
      - name: Choose npm dist-tag
        id: dist
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      # npm 11.5.1+ is required for trusted publishing. Node 20 ships with
      # npm 10.x, so upgrade before publishing. Provenance is automatic
      # under trusted publishing — no flag needed. Pinned to 11: npm 12
      # requires Node >=22.22.2 and fails EBADENGINE on Node 20.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm publish --access public --tag ${{ steps.dist.outputs.tag }}
      # Create a GitHub Release with auto-generated notes (commits + PRs
      # since the previous tag) only after the npm publish succeeded.
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.dist.outputs.tag == 'next' && '--prerelease' || '' }}
